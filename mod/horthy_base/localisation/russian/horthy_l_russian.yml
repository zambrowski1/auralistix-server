  HUN_Miklos_Horthy: "Миклош Хорти"
  HUN_Miklos_Horthy_desc: "Миклош Хорти — регент Королевства Венгрия и бывший адмирал Австро-Венгерского флота. После распада империи и периода политического хаоса он пришёл к власти в 1920 году, восстановив порядок и обеспечив стране относительную стабильность. Несмотря на отсутствие короля, Венгрия при Хорти сохраняет монархическую форму правления.\n\nК 1936 году Хорти остаётся символом консервативного государственного курса, опирающегося на армию, аристократию и традиционные элиты. Его главной целью является пересмотр послевоенных договоров и возвращение утраченного международного влияния Венгрии, при этом он старается избегать открытых конфликтов и резких идеологических экспериментов."
