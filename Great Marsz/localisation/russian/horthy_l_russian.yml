  horthy_polyglot: "Полиглот"
  horthy_conservative_regent: "Консервативный регент"
  horthy_admiral_without_fleet: "Адмирал без флота"
  horthy_regent_without_king: "Регент без короля"

  HUN_Miklos_Horthy: "Миклош Хорти"
  HUN_Miklos_Horthy_desc: "Миклош Хорти — регент Королевства Венгрия и бывший адмирал Австро-Венгерского флота. После распада империи и периода политического хаоса он пришёл к власти в 1920 году, восстановив порядок и обеспечив стране относительную стабильность. Несмотря на отсутствие короля, Венгрия при Хорти сохраняет монархическую форму правления.\n\nК 1936 году Хорти остаётся символом консервативного государственного курса, опирающегося на армию, аристократию и традиционные элиты. Его главной целью является пересмотр послевоенных договоров и возвращение утраченного международного влияния Венгрии, при этом он старается избегать открытых конфликтов и резких идеологических экспериментов."
  HUN_pal_pronay_desc: "Офицер старой школы и радикальный националист, Пал Пронаи сделал имя на парамилитарных структурах и бескомпромиссных методах. К 1936 году его фигура вызывает одновременно страх и преданность — предвестие более жёсткого порядка."

  HUN_pronay_regime: "Режим Пронаи"
  HUN_pronay_regime_desc: "Жёсткая власть, опирающаяся на сеть лоялистов, запугивание и культ порядка."

  HUN_pronay_purges: "Политические чистки"
  HUN_pronay_purges_desc: "Оппозиционные структуры разрушаются арестами, давлением и систематическими репрессиями."

  HUN_pronay_gendarmerie: "Расширенная жандармерия"
  HUN_pronay_gendarmerie_desc: "Силовой аппарат усиливается, чтобы держать страну в узде."

  HUN_pronay_decisions: "Укрепление власти Пронаи"
  HUN_pronay_consolidate_power: "Укрепить власть"
  HUN_pronay_consolidate_power_desc: "Зафиксировать контроль над ключевыми институтами и привязать аппарат к новому порядку."

  HUN_pronay_purge_opposition: "Зачистить оппозицию"
  HUN_pronay_purge_opposition_desc: "Ликвидировать демократические и коммунистические структуры, пока они не успели организоваться."

  HUN_pronay_expand_gendarmerie: "Расширить жандармерию"
  HUN_pronay_expand_gendarmerie_desc: "Усилить внутреннюю безопасность и контроль над провинциями."

  HUN_pronay_mobilize_garda: "Мобилизовать гвардию"
  HUN_pronay_mobilize_garda_desc: "Привлечь лояльные формирования для усиления мобресурса и готовности."

  HUN_pronay_border_raids: "Поощрять пограничные рейды"
  HUN_pronay_border_raids_desc: "Поднять напряжение за рубежом через провокации и действия с правдоподобным отрицанием."
