l_russian:
  horthy_polyglot: "Полиглот"
  horthy_conservative_regent: "Консервативный регент"
  horthy_admiral_without_fleet: "Адмирал без флота"
  horthy_regent_without_king: "Регент без короля"

  HUN_Miklos_Horthy:0 "Миклош Хорти"
  HUN_Pal_Pronay: "Пал Пронаи"
  HUN_Miklos_Horthy_desc:0 "Миклош Хорти — регент Королевства Венгрия и бывший адмирал Австро-Венгерского флота. После распада империи и периода политического хаоса он пришёл к власти в 1920 году, восстановив порядок и обеспечив стране относительную стабильность. Несмотря на отсутствие короля, Венгрия при Хорти сохраняет монархическую форму правления.\n\nК 1936 году Хорти остаётся символом консервативного государственного курса, опирающегося на армию, аристократию и традиционные элиты. Его главной целью является пересмотр послевоенных договоров и возвращение утраченного международного влияния Венгрии, при этом он старается избегать открытых конфликтов и резких идеологических экспериментов."
  HUN_Pal_Pronay_desc: "Пал Пронаи — фигура, внушающая трепет даже его союзникам. Бывший офицер австро-венгерской армии, он снискал кровавую славу в 1919 году как лидер карательного отряда, беспощадно подавлявшего остатки Венгерской Советской Республики. Его роль в «Белом терроре» и создание «Рондьош Гарды» для борьбы за Бургенланд сделали его национальным героем для радикалов, но опасным фанатиком для умеренных кругов во главе с Хорти."

  HUN_rongyos_garda_p: "«Рондьош Гарда»"
  HUN_rongyos_garda_p_long: "«Рондьош Гарда»"

  HUN_pronay_regime: "Режим Пронаи"
  HUN_pronay_regime_desc: "Жёсткая власть, опирающаяся на сеть лоялистов, запугивание и культ порядка."

  HUN_pronay_purges: "Политические чистки"
  HUN_pronay_purges_desc: "Оппозиционные структуры разрушаются арестами, давлением и систематическими репрессиями."

  HUN_pronay_gendarmerie: "Расширенная жандармерия"
  HUN_pronay_gendarmerie_desc: "Силовой аппарат усиливается, чтобы держать страну в узде."

  HUN_pronay_decisions: "Укрепление власти Пронаи"
  HUN_pronay_consolidate_power: "Укрепить власть"
  HUN_pronay_consolidate_power_desc: "Зафиксировать контроль над ключевыми институтами и привязать аппарат к новому порядку."

  HUN_pronay_purge_opposition: "Зачистить оппозицию"
  HUN_pronay_purge_opposition_desc: "Ликвидировать демократические и коммунистические структуры, пока они не успели организоваться."

  HUN_pronay_expand_gendarmerie: "Расширить жандармерию"
  HUN_pronay_expand_gendarmerie_desc: "Усилить внутреннюю безопасность и контроль над провинциями."

  HUN_pronay_mobilize_garda: "Мобилизовать гвардию"
  HUN_pronay_mobilize_garda_desc: "Привлечь лояльные формирования для усиления мобресурса и готовности."

  HUN_pronay_border_raids: "Поощрять пограничные рейды"
  HUN_pronay_border_raids_desc: "Поднять напряжение за рубежом через провокации и действия с правдоподобным отрицанием."
  
   HUN_political_actions_begin: "Начало политических действий"
 HUN_political_actions_begin_desc: "Политическая система Венгрии всё ещё формально стабильна, однако под поверхностью нарастают противоречия. Настало время перейти от пассивного ожидания к активным действиям."

 HUN_regency_question: "Вопрос регентства"
 HUN_regency_question_desc: "Фигура регента остаётся ключевой для будущего страны. Следует вновь поднять вопрос о характере власти и допустимых границах регентского правления."

 HUN_call_for_order: "Призыв к порядку"
 HUN_call_for_order_desc: "Общество требует твёрдой руки. Под лозунгами восстановления порядка можно оправдать усиление контроля и подавление политических противников."

 HUN_rongyos_garda: "«Рондьош Гарда»"
 HUN_rongyos_garda_desc: "Полувоенные националистические формирования могут стать удобным инструментом давления и устрашения. Их использование радикализует политику, но укрепит решимость сторонников."

 HUN_white_terror_legacy: "Наследие Белого террора"
 HUN_white_terror_legacy_desc: "Воспоминания о Белом терроре всё ещё живы. Возвращение его методов способно запугать оппозицию, но приведёт к росту нестабильности."

 HUN_pronay_network: "Сеть Пронаи"
 HUN_pronay_network_desc: "Пал Пронаи обладает обширными связями среди радикалов, офицеров и тайных обществ. Создание его неформальной сети подготовит почву для захвата власти."

 HUN_pronay_as_pm: "Пронаи — премьер-министр"
 HUN_pronay_as_pm_desc: "Формальное вхождение Пронаи в правительство станет важным шагом к демонтажу старого порядка и радикальному изменению политического курса."

 HUN_pronay_takes_power: "Пронаи берёт власть"
 HUN_pronay_takes_power_desc: "Политический кризис достиг пика. При отсутствии внешних и внутренних препятствий Пронаи может окончательно устранить оппонентов и установить авторитарный режим."
 
 HUN_executioner_of_the_regime: "Палач режима"

 HUN_political_outsider: "Политический аутсайдер"

 HUN_white_terrorist: "Белый террорист"
 HUN_pronay_takes_power_custom_tt: "§HПал Пронаи§! станет лидером партии §HФашизм§! и начнёт служить §Hфельдмаршалом§!, а §H«Рондьош Гарда»§! возьмёт власть в стране."

rongyos_garda_commander_GM: "Командир «Рондьош Гарды»"
rongyos_garda_commander_GM_desc: "§gЭтот офицер прошел через горнило террора и мелких стычек. Он умеет выжимать максимум из парамилитарных формирований, но лишён штабного опыта.§!"

l_russian:
  HUN_radicalisation_front:0 "Радикализация политического фронта"
  HUN_radicalisation_front_desc:0 "Консервативное равновесие трещит: общество требует реванша, порядок — силы, а политика — решительности."

  HUN_disappointment_regency:0 "Разочарование в регентстве"
  HUN_disappointment_regency_desc:0 "Осторожность регентства всё чаще воспринимается как слабость. Радикалы получают шанс навязать свою повестку."

  HUN_trianon_unfinished:0 "Незакрытая страница Трианона"
  HUN_trianon_unfinished_desc:0 "Трианон — не прошлое, а рана. Реваншизм превращается в политическую программу."

  HUN_forgotten_veterans:0 "Забытые ветераны Великой войны"
  HUN_forgotten_veterans_desc:0 "Ветераны живут воспоминаниями о потерянной славе и унижении. Их можно направить в новое движение."

  HUN_two_poles:0 "Два полюса"
  HUN_two_poles_desc:0 "Радикальный лагерь раскалывается: одни делают ставку на улицу и партию, другие — на дисциплину, офицеров и отряды."

  HUN_rongyos_garda:0 "«Рондьёш Гарда»"
  HUN_rongyos_garda_desc:0 "Парамилитарные структуры оформляются в единую силу. С этого момента у радикалов появляется собственное имя — и собственная воля."

  HUN_revival_oborvantsy:0 "Возрождение «оборванцев»"
  HUN_revival_oborvantsy_desc:0 "Старые сети, старые методы и новые цели. Ветеранские отряды вновь собираются вокруг ядра движения."

  HUN_garrison_contacts:0 "Связь с гарнизонами"
  HUN_garrison_contacts_desc:0 "Без опоры на провинциальные гарнизоны любой переворот обречён. Время искать союзников среди офицеров."

  HUN_officer_circles:0 "Офицерские кружки"
  HUN_officer_circles_desc:0 "Тихие встречи, закрытые разговоры, клятвы и списки. Армия начинает жить двойной жизнью."

  HUN_black_lists:0 "«Чёрные списки»"
  HUN_black_lists_desc:0 "Лоялисты, либералы, противники — каждому найдётся папка. Когда придёт час, сомнений быть не должно."

  HUN_burgenland_experience:0 "Опыт Бургенланда"
  HUN_burgenland_experience_desc:0 "Пограничные кризисы учат главному: решает скорость, дисциплина и готовность действовать до приказа."

  HUN_plan_saint_stephen:0 "План «Святой Иштван»"
  HUN_plan_saint_stephen_desc:0 "Переворот требует плана, каналов связи и точного времени. Ошибка будет стоить всего."

  HUN_budapest_night:0 "Будапештская ночь"
  HUN_budapest_night_desc:0 "В столице сгущаются тени. Двери закрываются, телефоны молчат, а нужные люди уже на местах."

  HUN_night_of_long_knives:0 "Будапештская ночь длинных ножей"
  HUN_night_of_long_knives_desc:0 "Сомнения — роскошь. Внутренние враги должны исчезнуть до рассвета, иначе исчезнет само движение."
  
 GM_HUN_right_struggle: "Правая борьба"
 GM_HUN_right_struggle_desc: "Политический фронт радикализирован, на поле битвы выходят Ференц Салаши со своей ультраправой фашистской партией «Скрещённые стрелы» и Пал Пронаи из парамилитаристской организации «Рондьёш Гарда». Судьба Венгрии находится в руках двух радикалов, чьё право на власть будет определено на улицах этого государства.\n\n§7Поддержка Пронаи§!: §7[?GM_pronai_support]§!\n§6Поддержка Салаши§!: §6[?GM_szlasi_support]§!\n§YРадикализация населения§!: §Y[?GM_population_radicalization]§!%\n\nКаждые §Y4%§! радикализации: §R-1%§! стабильности."

 GM_HUN_right_struggle_status: "Сводка: правая борьба"
 GM_HUN_right_struggle_status_desc: "Текущее соотношение сил:\n\n§7Поддержка Пронаи§!: §7[?GM_pronai_support]§!\n§6Поддержка Салаши§!: §6[?GM_szlasi_support]§!\n§YРадикализация населения§!: §Y[?GM_population_radicalization]§!%"

# --- Новые фокусы ---
  HUN_volksbund_question:0 "Вопрос Фольксбунда"
  HUN_volksbund_question_desc:0 "Немецкое меньшинство объединяется в организацию «Фольксбунд». Для одних это ценный ресурс и мост к Берлину, для других — пятая колонна. Нам предстоит решить их судьбу."

  # --- Ивенты ---
  HUN_event.1.t:0 "Вопрос Фольксбунда"
  HUN_event.1.d:0 "Нилашисты готовы пойти на уступки с Фольксбундом в дальнейшем, при условии, что они помогут в борьбе с «оборванцами». Однако для радикалов-националистов сама мысль о том, что немцы будут диктовать условия на венгерской земле, является оскорблением."
  HUN_event.1.a:0 "Договор с Фольксбундом"
  HUN_event.1.b:0 "Покончить с Фольксбундом"

  HUN_event.2.t:0 "Забытые ветераны войны"
  HUN_event.2.d:0 "Тысячи ветеранов Великой войны чувствуют себя преданными. Опытных офицеров можно направить в первые ряды партии, а солдат — в наши ударные отряды. Они могут стать решающей силой в грядущем конфликте."
  HUN_event.2.a:0 "Пополнить партию нилашистов"
  HUN_event.2.b:0 "Поддержать «оборванцев»"

  # --- Национальные духи (Идеи) ---
  HUN_volksbund_concessions:0 "Уступки Фольксбунду"
  HUN_volksbund_concessions_desc:0 "Конечно, когда в наших рядах наравне с венграми сражаются те, кто считает себя выше нашего народа, ничем хорошим это не кончится."

  HUN_purged_volksbund:0 "Вырезанный Фольксбунд"
  HUN_purged_volksbund_desc:0 "Мы устранили тех, кто считал, что посмеет нами командовать. Мы показали всему миру урок."

  HUN_veterans_in_party:0 "Ветераны войны в партии"
  HUN_veterans_in_party_desc:0 "Когда-то мы помогли ветеранам Великой войны найти себе место под солнцем, а теперь они помогают нам. Мы в расчёте."

  HUN_veterans_in_ranks:0 "Ветераны войны в строю"
  HUN_veterans_in_ranks_desc:0 "Рондьёш Гарда представляет из себя лучшее место для таких, как они — ветераны. Дисциплина и храбрость движет ими, и это поможет нам в битве против партийцев Салаши."