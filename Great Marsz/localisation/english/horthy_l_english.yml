l_english:
  horthy_polyglot: "Polyglot"
  horthy_conservative_regent: "Conservative Regent"
  horthy_admiral_without_fleet: "Admiral Without a Fleet"
  horthy_regent_without_king: "Regent Without a King"

  HUN_Miklos_Horthy: "Miklos Horthy"
  HUN_Miklos_Horthy_desc: "Miklos Horthy is the regent of the Kingdom of Hungary and a former admiral of the Austro-Hungarian fleet. After the empire collapsed and a period of political chaos, he came to power in 1920, restoring order and ensuring relative stability. Despite the absence of a king, Hungary under Horthy retains a monarchical form of government.\n\nBy 1936, Horthy remains a symbol of a conservative state course, relying on the army, aristocracy, and traditional elites. His main goal is to revise the postwar treaties and restore Hungary's lost international influence, while he seeks to avoid open conflicts and sharp ideological experiments."
  HUN_pal_pronay_desc: "A veteran officer and a radical nationalist, Pál Prónay rose to prominence through his paramilitary networks and uncompromising methods. By 1936, his name evokes both fear and devotion—an omen of a harsher order."

  HUN_pronay_regime: "Prónay Regime"
  HUN_pronay_regime_desc: "A hardline rule built on loyal networks, intimidation, and an obsession with order."

  HUN_pronay_purges: "Political Purges"
  HUN_pronay_purges_desc: "Opposition structures are dismantled through arrests, intimidation, and systematic repression."

  HUN_pronay_gendarmerie: "Expanded Gendarmerie"
  HUN_pronay_gendarmerie_desc: "Security forces are reinforced to keep the country in line."

  HUN_pronay_decisions: "Prónay's Consolidation"
  HUN_pronay_consolidate_power: "Consolidate Power"
  HUN_pronay_consolidate_power_desc: "Secure the key institutions and bind the state apparatus to the new order."

  HUN_pronay_purge_opposition: "Purge the Opposition"
  HUN_pronay_purge_opposition_desc: "Eliminate democratic and communist structures before they can organize."

  HUN_pronay_expand_gendarmerie: "Expand the Gendarmerie"
  HUN_pronay_expand_gendarmerie_desc: "Increase internal security capacity and tighten control over the provinces."

  HUN_pronay_mobilize_garda: "Mobilize the Garda"
  HUN_pronay_mobilize_garda_desc: "Call on loyal paramilitary formations to bolster manpower and readiness."

  HUN_pronay_border_raids: "Encourage Border Raids"
  HUN_pronay_border_raids_desc: "Turn up the pressure abroad through deniable actions and provocations."
